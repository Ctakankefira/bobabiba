version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: masters
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://user:pass@db:5432/masters
      JWT_SECRET: secret
      BOT_TOKEN: ${BOT_TOKEN}
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    ports:
      - "3001:3000"
    environment:
      BACKEND_URL: http://backend:3000
    depends_on:
      - backend

volumes:
  postgres_data: